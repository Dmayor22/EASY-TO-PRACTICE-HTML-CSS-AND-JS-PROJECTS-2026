<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <div class="container">
      <div class="display"></div>

      <div class="numerical">
        <button type="button" class="numbers_btn">AC</button>
        <button type="button" class="numbers_btn">DE</button>
        <button type="button" class="numbers_btn">.</button>
        <button type="button" class="numbers_btn">/</button>
        <button type="button" class="numbers_btn">7</button>
        <button type="button" class="numbers_btn">8</button>
        <button type="button" class="numbers_btn">9</button>
        <button type="button" class="numbers_btn">*</button>
        <button type="button" class="numbers_btn">4</button>
        <button type="button" class="numbers_btn">5</button>
        <button type="button" class="numbers_btn">6</button>
        <button type="button" class="numbers_btn">-</button>
        <button type="button" class="numbers_btn">1</button>
        <button type="button" class="numbers_btn">2</button>
        <button type="button" class="numbers_btn">3</button>
        <button type="button" class="numbers_btn">+</button>
        <button type="button" class="numbers_btn">00</button>
        <button type="button" class="numbers_btn">0</button>
        <button type="button" class="numbers_btn" id="equal" >=</button>
        <button type="button" class="numbers_btn">=</button>
      </div>
    </div>
  </body>
</html>
