<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatBox UI</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <main class="chatbox_container">
      <div class="chatbox">
        <!-- leftside side -->
        <div class="left_col">
          <div class="chatbox_msg">
            <div class="chatbox_msg_text">
              <h2>Steve Austion</h2>
              <p>I am waiting for your reply</p>
            </div>
            <img src="./images/member-1.png" alt="" class="chat_img" />
          </div>

          <div class="chatbox_msg">
            <img src="./images/member-2.png" alt="" class="chat_img" />
            <div class="chatbox_msg_text">
              <h2>Amy Jackson</h2>
              <p>
                I would like to go for a morning walk from tomorrow onwards. You
                can also join me anytime
              </p>
            </div>
          </div>

          <div class="chatbox_msg">
            <div class="chatbox_msg_text">
              <h2>Steve Austion</h2>
              <p>Great, I will be joining soon</p>
            </div>
            <img src="./images/member-1.png" alt="" class="chat_img" />
          </div>


          <input type="text" placeholder="Enter your message here..." />
        </div>

        <!-- right side -->
        <div class="right_col">
          <h3>Friend List</h3>
          <ul>
            <li class="online">Johny Austin</li>
            <li class="offline">Dwayned T</li>
            <li class="busy">Rey Mysterio</li>
            <li class="online">Seth Rollins</li>
            <li class="busy">ROman Reigns</li>
          </ul>
        </div>
      </div>
    </main>
  </body>
</html>
