<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatBox UI</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <main class="chatbox_container">
      <div class="chatbox">
        <!-- leftside side -->
        <div class="left_col">
          <div class="chatbox_msg">
            <div class="chatbox_msg_text">
              <h2>Steve Austion</h2>
              <p>I am waiting for your reply</p>
            </div>
            <img src="./images/member-1.png" alt="" class="chat-img" />
          </div>
        </div>

        <!-- right side -->
        <div class="right_col"></div>
      </div>
    </main>
  </body>
</html>
